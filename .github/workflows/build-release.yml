name: Build Game Distributions

on:
  push:
    branches:
      - release
      - 'release/**'
  workflow_dispatch:

jobs:
  build:
    name: Build (linux / win / mac)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Ren'Py SDK
        run: curl -fL -o sdk_download https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2

      - name: Extract SDK
        run: tar -xjf sdk_download

      - name: Build distributions
        run: |
          SDK="renpy-8.5.3-sdk"
          "$SDK/renpy.sh" "$SDK/launcher" distribute "${{ github.workspace }}" \
            --package linux \
            --package win \
            --package mac \
            --destination dist \
            --no-update

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParadiseLost-dist
          path: dist/*
          if-no-files-found: error
